<meta name="theme-color" content="#fff6ec" />
<meta property="og:title" content="Cổng Quà Tặng VIP — Đăng Ký Nhận Thưởng" />
<meta property="og:description" content="Ưu đãi hội viên mới: đăng ký nhanh, nhận thưởng liền tay." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #2a2338;
    --ink-soft: #6b6076;
    --red: #ef233c;
    --red-deep: #d31b33;
    --orange: #ff7a18;
    --gold: #ffb01f;
    --gold-deep: #e89700;
    --green: #0b9450;
    --blue: #1a6fe0;
    --shadow: 0 26px 60px rgba(223, 128, 74, .20), 0 4px 14px rgba(223, 128, 74, .10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(42rem 42rem at 8% -6%, rgba(255, 193, 64, .34), transparent 62%),
      radial-gradient(46rem 46rem at 104% 8%, rgba(255, 45, 85, .18), transparent 60%),
      radial-gradient(54rem 40rem at 50% 112%, rgba(255, 138, 0, .22), transparent 64%),
      linear-gradient(165deg, #fffaF3 0%, #fff0f2 46%, #fff8e6 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- trang trí nền ---------- */
  .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

  .spark {
    position: absolute;
    width: 18px; height: 18px;
    background: linear-gradient(135deg, #ffd977, #ffb01f);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    opacity: .55;
    animation: drift 9s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(255, 176, 31, .5));
  }
  .spark.s1 { top: 12%; left: 12%; width: 22px; height: 22px; animation-delay: -1s; }
  .spark.s2 { top: 22%; right: 14%; width: 14px; height: 14px; opacity: .45; animation-delay: -3.5s; }
  .spark.s3 { bottom: 18%; left: 18%; width: 16px; height: 16px; opacity: .4; animation-delay: -6s; }
  .spark.s4 { bottom: 10%; right: 12%; width: 26px; height: 26px; opacity: .5; animation-delay: -2.2s; }

  @keyframes drift {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
    50% { transform: translate3d(6px, -14px, 0) scale(1.12) rotate(18deg); }
  }

  .halo {
    position: absolute; left: 50%; top: 18%;
    width: 340px; height: 340px; margin-left: -170px;
    background: radial-gradient(circle, rgba(255, 200, 90, .55) 0%, rgba(255, 200, 90, 0) 70%);
    filter: blur(6px);
    opacity: .55;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .42; } 50% { transform: scale(1.06); opacity: .62; } }

  /* ---------- thẻ chính ---------- */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 418px;
    padding: 26px 22px 20px;
    border-radius: 30px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(255, 252, 247, .88));
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    text-align: center;
    animation: cardIn .55s cubic-bezier(.22, .9, .3, 1) both;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg, rgba(255, 214, 122, .95), rgba(255, 255, 255, 0) 35%, rgba(255, 138, 0, .55));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }

  /* ---------- badge ---------- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ffe27a, #ffbc2e 62%, #ffa200);
    color: #7a3b00;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .9px;
    text-transform: uppercase;
    border: 1px solid #ffe9a8;
    box-shadow: 0 8px 18px rgba(255, 176, 31, .35), inset 0 1px 0 rgba(255, 255, 255, .8);
    margin-bottom: 4px;
  }
  .badge svg { width: 14px; height: 14px; flex: none; }

  /* ---------- quà ---------- */
  .gift {
    position: relative;
    width: 96px; height: 96px;
    margin: 10px auto 8px;
    display: flex; align-items: center; justify-content: center;
    animation: float 3.6s ease-in-out infinite;
  }
  .gift svg { width: 100%; height: 100%; filter: drop-shadow(0 12px 18px rgba(255, 154, 0, .32)); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  /* ---------- tiêu đề ---------- */
  .title {
    margin: 2px 0 6px;
    font-size: 20px;
    line-height: 1.28;
    font-weight: 900;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: #332a44;
  }
  .title .accent {
    display: block;
    margin-top: 2px;
    font-size: 25px;
    letter-spacing: .2px;
    background: linear-gradient(100deg, #ef233c 0%, #ff5a1f 42%, #ff8a00 62%, #ef233c 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shine 4.5s linear infinite;
    filter: drop-shadow(0 3px 6px rgba(239, 35, 60, .16));
  }
  @keyframes shine { to { background-position: 200% center; } }

  .subtitle {
    margin: 0 auto 16px;
    max-width: 320px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  /* ---------- ticker ---------- */
  .ticker-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .2px;
    color: #b25a3c;
  }
  .ticker-label .live {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 0 0 rgba(255, 59, 48, .55);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, .5); }
    70% { box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
  }

  .ticker {
    position: relative;
    height: 108px;
    margin: 0 0 16px;
    border-radius: 16px;
    background: linear-gradient(180deg, #fffdfa, #fff6ea);
    border: 1px solid #ffe2bf;
    box-shadow: inset 0 1px 0 #fff, 0 8px 20px rgba(232, 151, 0, .10);
    overflow: hidden;
    text-align: left;
  }
  .ticker-track { will-change: transform; padding: 6px 12px; }

  .ticker-group { padding: 6px 12px; }

  .ticker-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 7px;
    padding: 8px 0;
    border-bottom: 1px dashed #f0dbc4;
    font-size: 12px;
    line-height: 1.3;
    white-space: nowrap;
  }
  .ticker-group .ticker-item:last-child { border-bottom: 0; }

  .who {
    flex: none;
    max-width: 78px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 800;
    color: var(--blue);
  }
  .act { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 700; color: var(--green); }
  .act b { font-weight: 900; color: var(--red-deep); }
  .when { flex: none; font-size: 10px; font-weight: 600; color: #b09a86; }

  /* ---------- xác nhận 18+ ---------- */
  .confirm {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    padding: 12px 13px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #ffe0c7;
    box-shadow: 0 6px 16px rgba(232, 151, 0, .08);
    text-align: left;
    cursor: pointer;
    user-select: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .confirm:hover { border-color: #ffc98f; }
  .confirm input {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 21px; height: 21px;
    margin: 0;
    border: 2px solid #ffc06a;
    border-radius: 7px;
    background: #fff;
    cursor: pointer;
    position: relative;
    transition: background .18s, border-color .18s, transform .12s;
  }
  .confirm input:active { transform: scale(.92); }
  .confirm input:checked {
    background: linear-gradient(135deg, #ff5a1f, #ef233c);
    border-color: #ef233c;
  }
  .confirm input:checked::after {
    content: "";
    position: absolute;
    left: 6px; top: 2px;
    width: 5px; height: 10px;
    border: solid #fff;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .confirm input:focus-visible { outline: 2px solid #ff8a00; outline-offset: 2px; }
  .confirm span { font-size: 12.5px; font-weight: 700; line-height: 1.42; color: #4a3b34; }

  /* ---------- nút ---------- */
  .btn {
    position: relative;
    width: 100%;
    padding: 17px 18px;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 900;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: #fff;
    cursor: pointer;
    overflow: hidden;
    background: linear-gradient(95deg, #ff2d55 0%, #ff5a1f 48%, #ffa200 100%);
    box-shadow: 0 16px 30px rgba(255, 77, 32, .34), inset 0 1px 0 rgba(255, 255, 255, .35);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    isolation: isolate;
  }
  .btn::after {
    content: "";
    position: absolute;
    top: -60%; bottom: -60%; left: -40%;
    width: 34%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .55), rgba(255, 255, 255, 0));
    transform: skewX(-18deg);
    animation: sweep 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sweep {
    0% { left: -45%; }
    55%, 100% { left: 125%; }
  }
  .btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 20px 36px rgba(255, 77, 32, .40), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .btn:not(:disabled):active { transform: translateY(0); filter: brightness(.97); }
  .btn:focus-visible { outline: 3px solid #ffb01f; outline-offset: 3px; }
  .btn:disabled {
    background: linear-gradient(180deg, #eee7de, #e6ddd2);
    color: #ab9f92;
    cursor: not-allowed;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 6px 14px rgba(180, 150, 120, .12);
  }
  .btn:disabled::after { display: none; }
  .btn.is-loading { pointer-events: none; }
  .btn.is-loading::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(95deg, #ff2d55, #ff8a00);
    z-index: -1;
  }
  .btn .dots { display: inline-flex; gap: 3px; margin-left: 7px; vertical-align: 2px; }
  .btn .dots i { width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .35; animation: dot 1s infinite; }
  .btn .dots i:nth-child(2) { animation-delay: .15s; }
  .btn .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

  .note {
    margin: 10px 2px 0;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.5;
    color: #a3937f;
  }

  .footer {
    margin: 16px 0 2px;
    padding-top: 12px;
    border-top: 1px dashed #f0dfcc;
    font-size: 11px;
    font-weight: 600;
    color: #ab9a88;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 380px) {
    .card { padding: 22px 16px 16px; border-radius: 26px; }
    .title { font-size: 18px; }
    .title .accent { font-size: 22px; }
    .gift { width: 82px; height: 82px; }
    .btn { font-size: 14.5px; padding: 16px; }
  }

  @media (min-width: 720px) {
    .card { max-width: 430px; padding: 32px 28px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>

      'nguyenthu2k', 'quangvinh7x', 'phuongnam88', 'thuydung9x', 'manhtuan2k',
      'hainguyen99', 'bichtram88', 'tuankiet07', 'thanhphong9', 'ngocmai2k',
      'minhduc99', 'hoanghuy88', 'vietanh2k', 'sonthanh9x', 'kimlien88',
      'ducthang2k1', 'quocbao99', 'anhkhoa07', 'thuonghieu9x', 'phucnguyen2k'
    ];

    // Nội dung thưởng — 3 dòng theo yêu cầu
    var REWARDS = [
      { action: 'Vừa Nhận Thưởng Đăng Ký', amount: '88k' },
      { action: 'Vừa Nhận Thưởng Nạp', amount: '188k' },
      { action: 'Vừa Nhận Thưởng Nạp', amount: '288K' }
    ];

    var TIMES = [
      'vừa xong', 'vài giây trước', '30 giây trước',
      '1p trước', '1p trước', '2p trước', '2p trước', '3p trước',
      '4p trước', '5p trước', '6p trước', '7p trước', '8p trước',
      '9p trước', '10p trước', '12p trước', '15p trước'
    ];

    var VISIBLE_ITEMS = 12; // số dòng giữ trong DOM (đủ lấp khung)
    var SPEED = 24;         // tốc độ cuộn (px/giây)
    var RECENT_MAX = 40;    // không lặp tên trong 40 dòng gần nhất

    var recentNames = [];

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // chống trùng tên: random nhưng né 40 tên vừa xuất hiện
    function pickName() {
      var name = pick(NAMES);
      for (var i = 0; i < 30 && recentNames.indexOf(name) !== -1; i++) {
        name = pick(NAMES);
      }
      recentNames.push(name);
      if (recentNames.length > RECENT_MAX) recentNames.shift();
      return name;
    }

    function makeItem() {
      var reward = pick(REWARDS);

      var item = document.createElement('div');
      item.className = 'ticker-item';

      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = pickName() + '...';

      var act = document.createElement('span');
      act.className = 'act';
      act.appendChild(document.createTextNode(reward.action + ' '));

      var amount = document.createElement('b');
      amount.textContent = reward.amount;
      act.appendChild(amount);

      var when = document.createElement('span');
      when.className = 'when';
      when.textContent = pick(TIMES);

      item.appendChild(who);
      item.appendChild(act);
      item.appendChild(when);
      return item;
    }

    function fill() {
      track.innerHTML = '';
      var frag = document.createDocumentFragment();
      for (var i = 0; i < VISIBLE_ITEMS; i++) frag.appendChild(makeItem());
      track.appendChild(frag);
    }

    fill();

    // Người dùng bật "giảm chuyển động" -> giữ danh sách tĩnh
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    var offset = 0;
    var lastTs = 0;

    function step(ts) {
      if (!lastTs) lastTs = ts;
      // giới hạn dt để tab bị treo không làm nhảy dòng
      var dt = Math.min((ts - lastTs) / 1000, 0.1);
      lastTs = ts;

      offset += SPEED * dt;

      // dòng đầu cuộn hết -> xoá nó, chèn data fake mới ở cuối
      // => chạy vô hạn, mỗi dòng chỉ xuất hiện 1 lần, không lặp
      var first = track.firstElementChild;
      while (first) {
        var firstH = first.getBoundingClientRect().height || 33;
        if (offset < firstH) break;
        offset -= firstH;
        track.removeChild(first);
        track.appendChild(makeItem());
        first = track.firstElementChild;
      }

      track.style.transform = 'translate3d(0,' + (-offset).toFixed(2) + 'px,0)';
      window.requestAnimationFrame(step);
    }

    window.requestAnimationFrame(step);
  })();
  /* ========================================================= */

  var checkbox = document.getElementById('age');
  var cta = document.getElementById('cta');

  function buildUrl() {
    var url = CONFIG.destination;
    if (!CONFIG.promoCode) return url;
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    return url + sep + 'code=' + encodeURIComponent(CONFIG.promoCode);
  }

  function isInAppBrowser() {
    var ua = navigator.userAgent || '';
    return /FBAN|FBAV|FB_IAB|Instagram|TikTok|Bytedance|Zalo/i.test(ua);
  }

  function goToRegister() {
    var url = buildUrl();
    var isAndroid = /android/i.test(navigator.userAgent);

    // Trong app TikTok/Facebook trên Android: mở thẳng bằng Chrome
    // (webview của app thường chặn đăng ký / thanh toán)
    if (isAndroid && isInAppBrowser()) {
      var intent = 'intent://' + url.replace(/^https?:\/\//, '') +
        '#Intent;scheme=https;package=com.android.chrome;' +
        'S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
      window.location.href = intent;
      setTimeout(function () { window.location.href = url; }, 1200);
      return;
    }

    if (CONFIG.newTab) {
      window.open(url, '_blank', 'noopener');
    } else {
      window.location.href = url;
    }
  }

  checkbox.addEventListener('change', function () {
    cta.disabled = !checkbox.checked;
  });

  cta.addEventListener('click', function () {
    if (cta.disabled) return;
    cta.classList.add('is-loading');
    cta.innerHTML = 'ĐANG CHUYỂN HƯỚNG<span class="dots"><i></i><i></i><i></i></span>';
    goToRegister();
  });

  // fallback: nếu link bị chặn, mở tab mới
  window.addEventListener('blur', function () {
    if (cta.classList.contains('is-loading')) {
      cta.classList.remove('is-loading');
      cta.innerHTML = 'ĐĂNG KÝ NGAY';
    }
  });
</script>
